specVersion: 1.3.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: Aqua
    network: sepolia
    source:
      address: "0x30aefbDE9EC52A23E597e338F02f35Da909D7183"
      abi: Aqua
      startBlock: 11677683
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Protocol
        - Account
        - ZubiDubiStrategy
        - StrategyBalance
      abis:
        - name: Aqua
          file: ./abis/Aqua.json
      eventHandlers:
        - event: Shipped(address,address,bytes32,bytes)
          handler: handleShipped
        - event: Docked(address,address,bytes32)
          handler: handleDocked
        - event: Pushed(address,address,bytes32,address,uint256)
          handler: handlePushed
        - event: Pulled(address,address,bytes32,address,uint256)
          handler: handlePulled
      file: ./src/aqua.ts
  - kind: ethereum
    name: AquaSwapVMRouter
    network: sepolia
    source:
      address: "0x3d39B155De93CB9C340577E06b801C4956ed2a57"
      abi: AquaSwapVMRouter
      startBlock: 11677683
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Protocol
        - Account
        - Token
        - Swap
        - MakerExposure
        - ZubiDubiStrategy
      abis:
        - name: AquaSwapVMRouter
          file: ./abis/AquaSwapVMRouter.json
      eventHandlers:
        - event: Swapped(bytes32,address,address,address,address,uint256,uint256)
          handler: handleSwapped
      file: ./src/router.ts
  - kind: ethereum
    name: ZubiDubiRouteExecutor
    network: sepolia
    source:
      address: "0x99488C09A54092Aa3C7e725137B45f3612CC5be1"
      abi: ZubiDubiRouteExecutor
      startBlock: 11685531
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Protocol
        - Account
        - Route
        - RouteFee
        - MakerSkip
      abis:
        - name: ZubiDubiRouteExecutor
          file: ./abis/ZubiDubiRouteExecutor.json
      eventHandlers:
        - event: ZubiDubiRouteFilled(indexed address,indexed address,indexed address,address,uint256,uint256,uint256)
          handler: handleRouteFilled
        - event: ZubiDubiRouteFeePaid(indexed address,indexed address,uint256)
          handler: handleRouteFeePaid
        - event: ZubiDubiMakerSkipped(indexed bytes32,indexed address)
          handler: handleMakerSkipped
        - event: ZubiDubiTermRiskBudgetSet(indexed address,indexed bytes32,uint128,uint128,uint32)
          handler: handleTermRiskBudgetSet
        - event: ZubiDubiOrderBudgetAssigned(indexed bytes32,indexed address,indexed bytes32,address,address)
          handler: handleOrderBudgetAssigned
        - event: ZubiDubiTermRiskBudgetUsed(indexed address,indexed bytes32,indexed bytes32,uint256,uint256,uint256,uint256)
          handler: handleTermRiskBudgetUsed
      file: ./src/route-executor.ts
  - kind: ethereum
    name: ZubiDubiExitReceipt
    network: sepolia
    source:
      address: "0xb7877571932A025E03a7B9616F254B361FD1759F"
      abi: ZubiDubiExitReceipt
      startBlock: 11677683
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Token
        - ReceiptAsset
      abis:
        - name: ZubiDubiExitReceipt
          file: ./abis/ZubiDubiExitReceipt.json
      eventHandlers:
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleReceiptTransfer
      file: ./src/receipt.ts
