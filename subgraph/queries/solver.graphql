query SolverStrategies {
  markets(orderBy: cumulativeVolumeOut, orderDirection: desc) {
    id
    receiptToken { id symbol decimals }
    quoteToken { id symbol decimals }
    totalStrategyCount
    activeStrategyCount
    totalVirtualReceipt
    totalVirtualQuote
    totalReceiptExposure
    totalQuotePulled
    swapCount
    routeCount
    cumulativeVolumeIn
    cumulativeVolumeOut
    cumulativeProtocolSideRevenue
    lastUpdatedTimestamp
  }
  zubiDubiStrategies(where: { status: ACTIVE }, orderBy: updatedAtTimestamp, orderDirection: desc) {
    id
    orderHash
    market { id }
    strategyData
    maker { id }
    receiptToken { id symbol decimals }
    quoteToken { id symbol decimals }
    receiptVirtualBalance
    quoteVirtualBalance
    exposureAmount
    quotePulledAmount
    updatedAtTimestamp
  }
}

query RouteTape {
  routeFills(orderBy: timestamp, orderDirection: desc) {
    id
    routeTransactionHash
    orderHash
    market { id receiptToken { symbol } quoteToken { symbol } }
    maker { id }
    taker { id }
    amountIn
    amountOut
    executionPriceE18
    timestamp
  }
  routes(orderBy: timestamp, orderDirection: desc) {
    id
    market { id }
    amountIn
    netAmountOut
    feeAmount
    fills
    transactionHash
    timestamp
  }
}

query StrategyTimeline {
  strategySnapshots(orderBy: timestamp, orderDirection: desc, first: 50) {
    id
    strategy { id orderHash maker { id } }
    market { id }
    reason
    status
    receiptVirtualBalance
    quoteVirtualBalance
    exposureAmount
    quotePulledAmount
    transactionHash
    timestamp
  }
}

query MakerExposure {
  makerExposures(orderBy: amount, orderDirection: desc) {
    maker { id }
    receiptToken { id symbol }
    amount
    swapCount
  }
}

query ProtocolRevenue {
  protocol(id: "zubidubi-sepolia") {
    cumulativeStrategyCount
    cumulativeSwapCount
    cumulativeRouteCount
    cumulativeVolumeIn
    cumulativeVolumeOut
    cumulativeProtocolSideRevenue
  }
  routeFees(orderBy: timestamp, orderDirection: desc) {
    feeRecipient { id }
    token { symbol }
    amount
    transactionHash
  }
}
